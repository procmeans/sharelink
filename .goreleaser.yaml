version: 2
project_name: sharelink

builds:
  - id: sharelink
    main: ./cmd/sharelink
    binary: sharelink
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}

archives:
  - id: sharelink
    format: tar.gz
    name_template: '{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}'
    files:
      - LICENSE
      - README.md

checksum:
  name_template: 'checksums.txt'

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'

brews:
  - name: sharelink
    repository:
      owner: procmeans
      name: homebrew-tap
      token: '{{ .Env.TAP_GITHUB_TOKEN }}'
    directory: Formula
    homepage: https://github.com/procmeans/sharelink
    description: Douyin watermark-free direct link extractor
    license: MIT
    test: |
      system "#{bin}/sharelink", "version"
    install: |
      bin.install "sharelink"
